name: Verify and deploy backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build TelegramCopilot.slnx -c Release /bl:artifacts/build.binlog
      - run: dotnet test TelegramCopilot.slnx -c Release --no-build --logger 'trx;LogFileName=backend.trx' --results-directory artifacts/tests /bl:artifacts/test.binlog
  invalidate_cache:
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/operate.yml@472a450fa4a7f8caca1b8b7c2b451eb7758dc442
    with:
      deployment-url: https://deploy.ryanl.in
      action: clear-route-cache
  release:
    needs: [test, invalidate_cache]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/release.yml@472a450fa4a7f8caca1b8b7c2b451eb7758dc442
    with:
      deployment-url: https://deploy.ryanl.in
      domain: ryanl.in
      platform-repository: Deploy-ryanl-in/personal-paas
      platform-sha: 472a450fa4a7f8caca1b8b7c2b451eb7758dc442
