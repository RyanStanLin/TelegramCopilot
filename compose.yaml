services:
  api:
    build:
      context: .
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    image: telegramcopilot-api:local
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5080
      DataPath: /data
      TZ: UTC
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - backend-data:/data
    security_opt:
      - no-new-privileges:true
  web:
    build: ./web
    image: telegramcopilot-web:local
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TELEGRAMCOPILOT_API_URL: http://api:5080
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEB_DATA_PATH: /data
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - web-data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  web-data:
  backend-data:
